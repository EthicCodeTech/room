name: Windows

on:
  push:
    branches: [main, v1.2-dev]
    paths: ["windows/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: windows

jobs:
  # The engine's tests, on a real Windows machine: drive letters, long paths, reparse points, the lot.
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: windows }
      - run: cargo test -p room-core
      - run: cargo clippy -p room-core --all-targets -- -D warnings

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x64, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: arm64, os: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.name == 'arm64' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: windows, key: "${{ matrix.target }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: windows/app
      - name: Build the app and its installer
        run: npx tauri build --target ${{ matrix.target }}
        working-directory: windows/app
      - name: Collect
        shell: bash
        run: |
          mkdir -p ../out
          cp "target/${{ matrix.target }}/release/room.exe" "../out/Room-1.2.0-${{ matrix.name }}-portable.exe"
          cp target/${{ matrix.target }}/release/bundle/nsis/*.exe "../out/Room-1.2.0-${{ matrix.name }}-setup.exe"
          cd ../out && (sha256sum * > SHA256SUMS-${{ matrix.name }}.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: room-windows-${{ matrix.name }}
          path: out/*
          if-no-files-found: error
